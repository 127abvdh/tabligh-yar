<!DOCTYPE html><html lang="fa"><head><meta charset="UTF-8"><title>داشبورد</title><style>*{margin:0;padding:0}body{font-family:Arial;background:#f0f4f8}h1{padding:10px;background:#0a1f5c;color:#fff;font-size:14px}a,button{color:#fff;background:none;border:none;cursor:pointer;font-size:11px;margin:0 5px}.c{background:#fff;padding:10px;margin:10px}.s{font-size:20px;font-weight:bold}</style></head><body><h1>📊<a href="/sales.html">فروش</a><button onclick="logout()">خروج</button></h1><div class="c"><p class="s" id="s1">۰</p><p style="font-size:11px;color:#666">درآمد</p></div><div class="c"><p>نام: <span id="n">-</span></p><p>کد: <span id="c">-</span></p><button onclick="copy()" style="width:100%;padding:5px;background:#2563eb;color:#fff;border:none;margin-top:5px;font-size:11px">کپی</button></div><div class="c"><p id="t">تیم: خالی</p></div><script>fetch('/api/dashboard',{headers:{Authorization:`Bearer ${localStorage.getItem('token')}`}}).then(e=>e.json()).then(e=>{document.getElementById('s1').textContent=Math.floor(e.stats.totalEarnings/1e6)+'M',document.getElementById('n').textContent=e.user.name,document.getElementById('c').textContent=JSON.parse(localStorage.getItem('user')).referralCode||'-',document.getElementById('t').textContent=e.team.length+' نفر'}).catch(()=>alert('خطا'));function copy(){navigator.clipboard.writeText(document.getElementById('c').textContent)}function logout(){localStorage.removeItem('token'),localStorage.removeItem('user'),window.location.href='/'}</script></body></html>
