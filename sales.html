<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت فروش - تبلیغ‌یار</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma;background:#f0f4f8;color:#333}header{background:linear-gradient(135deg,#0a1f5c,#1e3a8a);color:#fff;padding:20px;display:flex;justify-content:space-between}.header-left h1{font-size:24px}.header-right{display:flex;gap:10px}.btn-back,.btn-logout{background:rgba(255,255,255,.2);color:#fff;border:1px solid #fff;padding:8px 15px;border-radius:6px;cursor:pointer;text-decoration:none;font-size:14px}.container{max-width:800px;margin:30px auto;padding:0 15px}.section{background:#fff;padding:25px;border-radius:12px;margin-bottom:25px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.section h2{color:#0a1f5c;margin-bottom:20px;border-bottom:2px solid #e0e7ff;font-size:20px}.form-group{margin-bottom:20px}label{display:block;color:#0a1f5c;margin-bottom:8px;font-weight:bold}input,textarea,select{width:100%;padding:12px;border:2px solid #e0e7ff;border-radius:8px;font-size:14px;font-family:inherit}.packages-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-top:10px}.package-card{border:2px solid #e0e7ff;border-radius:12px;padding:15px;text-align:center;cursor:pointer}.package-card.selected{border-color:#2563eb;background:#f0f4f8}.btn-submit{background:#2563eb;color:#fff;border:none;padding:14px;border-radius:8px;width:100%;font-weight:bold;cursor:pointer}.btn-submit:disabled{opacity:.6;cursor:not-allowed}.sales-table{width:100%;border-collapse:collapse;margin-top:15px}th{background:#f0f4f8;padding:12px;text-align:right;font-size:12px;font-weight:bold;border-bottom:2px solid #e0e7ff}td{padding:12px;border-bottom:1px solid #e0e7ff}.loading{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><header><div><h1>ثبت فروش 📊</h1></div><div class="header-right"><a href="/dashboard.html" class="btn-back">← بازگشت</a><button class="btn-logout" onclick="logout()">خروج</button></div></header><div class="container"><div class="section"><h2>فروش جدید</h2><div class="form-group"><label>نام کسب‌وکار</label><input type="text" id="businessName" placeholder="نام کسب‌وکار"></div><div class="form-group"><label>بسته</label><div class="packages-grid"><div class="package-card" onclick="selectPackage('bronze',5000000)"><div>🥉 برنزی</div><div>۵M</div></div><div class="package-card" onclick="selectPackage('silver',15000000)"><div>🥈 نقره‌ای</div><div>۱۵M</div></div><div class="package-card" onclick="selectPackage('gold',40000000)"><div>🥇 طلایی</div><div>۴۰M</div></div></div><input type="hidden" id="packageType"><input type="hidden" id="amount"></div><div class="form-group"><label>توضیحات</label><textarea id="description" placeholder="توضیح"></textarea></div><div style="background:#f0f4f8;padding:15px;border-radius:8px;margin-bottom:20px"><strong>درآمد:</strong> <span id="totalComm">۰</span></div><button class="btn-submit" id="submitBtn" onclick="submit()" disabled>ثبت فروش</button></div><div class="section"><h2>فروش‌های شما</h2><table class="sales-table" id="salesTable"><thead><tr><th>کسب‌وکار</th><th>بسته</th><th>مبلغ</th><th>تاریخ</th></tr></thead><tbody id="salesBody"><tr><td colspan="4" style="text-align:center;color:#999">در حال بارگذاری...</td></tr></tbody></table></div></div><script>const API='',COMM=.65;function toPersian(e){return e.toString().replace(/\d/g,e=>'۰۱۲۳۴۵۶۷۸۹'[e])}function selectPackage(e,t){document.querySelectorAll('.package-card').forEach(e=>e.classList.remove('selected')),event.currentTarget.classList.add('selected'),document.getElementById('packageType').value=e,document.getElementById('amount').value=t,document.getElementById('totalComm').textContent=toPersian(Math.floor(t*COMM/1e6))+'M',document.getElementById('submitBtn').disabled=!1}async function submit(){const e=localStorage.getItem('token'),t=document.getElementById('businessName').value,n=document.getElementById('packageType').value,a=document.getElementById('amount').value,o=document.getElementById('description').value;if(!t||!n)return void alert('نام و بسته الزامی است');document.getElementById('submitBtn').disabled=!0,document.getElementById('submitBtn').innerHTML='<div class="loading">⏳</div>';try{const i=await fetch(`${API}/api/sales/create`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${e}`},body:JSON.stringify({businessName:t,packageType:n,amount:parseInt(a),description:o})});if(!i.ok)throw new Error(await i.text());alert('✓ فروش ثبت شد'),document.getElementById('businessName').value='',document.getElementById('description').value='',document.getElementById('packageType').value='',document.getElementById('amount').value='',document.querySelectorAll('.package-card').forEach(e=>e.classList.remove('selected')),document.getElementById('submitBtn').disabled=!0,loadSales()}catch(e){alert('خطا: '+e.message)}finally{document.getElementById('submitBtn').disabled=!1,document.getElementById('submitBtn').innerHTML='ثبت فروش'}}async function loadSales(){const e=localStorage.getItem('token');try{const t=await fetch(`${API}/api/sales/user`,{headers:{Authorization:`Bearer ${e}`}}),n=await t.json();document.getElementById('salesBody').innerHTML=n.sales?.length?n.sales.map(e=>`<tr><td>${e.businessName}</td><td>${e.packageType}</td><td>${toPersian(Math.floor(e.amount/1e6))}M</td><td>${new Date(e.createdAt).toLocaleDateString('fa-IR')}</td></tr>`).join(''):'<tr><td colspan="4" style="text-align:center;color:#999">هنوز فروشی نیست</td></tr>'}catch{document.getElementById('salesBody').innerHTML='<tr><td colspan="4" style="text-align:center;color:red">خطا</td></tr>'}}function logout(){localStorage.removeItem('token'),localStorage.removeItem('user'),window.location.href='/'}window.addEventListener('load',()=>{localStorage.getItem('token')||window.location.href='/',loadSales()})</script></body></html>
